<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>P16 Label Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="P16 Label Desk">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span><strong>P16 Label Desk</strong><small>конструктор полос 228 × 18 мм</small></span>
    </div>
    <div class="top-actions">
      <button class="button ghost" id="exportJson" type="button">Проект JSON</button>
      <label class="button ghost file-button" for="importJson">Открыть JSON</label>
      <input id="importJson" type="file" accept="application/json,.json" hidden>
      <button class="button ghost" id="downloadSvg" type="button">Скачать SVG</button>
      <button class="button primary" id="printSheet" type="button">Печатать A4</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="editor" aria-label="Редактор подписей">
      <section class="editor-section channel-section">
        <div class="section-heading">
          <div>
            <h1>Каналы</h1>
            <p>Нажмите канал на полосе или здесь.</p>
          </div>
          <button class="icon-button" id="resetProject" type="button" title="Вернуть исходную раскладку" aria-label="Вернуть исходную раскладку">↺</button>
        </div>
        <div class="channel-grid" id="channelGrid" aria-label="Выбор канала"></div>
      </section>

      <section class="editor-section selected-section">
        <div class="selected-heading">
          <span class="channel-badge" id="selectedNumber">1</span>
          <div><h2 id="selectedTitle">VOC1</h2><p id="selectedRange">Канал 1</p></div>
        </div>

        <div class="form-grid">
          <label class="field field-wide">
            <span>Название</span>
            <input id="channelName" data-testid="channel-name" type="text" maxlength="24" autocomplete="off">
          </label>
          <label class="field field-wide">
            <span>Подпись мелким</span>
            <input id="channelSubtitle" type="text" maxlength="32" placeholder="необязательно" autocomplete="off">
          </label>
          <label class="field">
            <span>Ширина</span>
            <select id="channelSpan">
              <option value="1">1 канал</option>
              <option value="2">2 канала</option>
            </select>
          </label>
          <label class="field">
            <span>Композиция</span>
            <select id="channelLayout">
              <option value="stack">Иконка сверху</option>
              <option value="left">Иконка слева</option>
              <option value="text">Только текст</option>
              <option value="icon">Только иконка</option>
            </select>
          </label>
          <label class="field">
            <span>Заливка</span>
            <select id="channelFill">
              <option value="top">Полоса сверху</option>
              <option value="bottom">Полоса снизу</option>
              <option value="full">Целиком</option>
              <option value="soft">Лёгкий фон</option>
              <option value="outline">Цветная рамка</option>
              <option value="icon">Только иконка</option>
            </select>
          </label>
          <label class="field">
            <span>Текст</span>
            <select id="channelTextColor">
              <option value="auto">Автоконтраст</option>
              <option value="dark">Тёмный</option>
              <option value="light">Белый</option>
              <option value="color">В цвет иконки</option>
            </select>
          </label>
        </div>

        <div class="color-row">
          <label class="color-field"><span>Цвет</span><input id="channelColor" type="color"></label>
          <div class="swatches" id="colorSwatches" aria-label="Готовые цвета"></div>
        </div>

        <div class="icon-editor">
          <div class="field-label-row"><span>Иконка</span><button id="removeIcon" class="text-button" type="button">Убрать</button></div>
          <div class="icon-grid" id="builtinIcons" aria-label="Рекомендуемые иконки"></div>
          <form class="icon-search" id="iconSearchForm">
            <input id="iconSearch" type="search" placeholder="Поиск по Iconify: drums, choir…" autocomplete="off">
            <button class="button small" type="submit">Найти</button>
          </form>
          <p class="search-status" id="searchStatus">Встроенные иконки работают без интернета.</p>
          <div class="icon-grid search-results" id="iconResults" aria-live="polite"></div>
        </div>

        <button class="button danger-quiet" id="clearChannel" type="button">Очистить выбранный канал</button>
      </section>

      <section class="editor-section global-section">
        <div class="section-heading"><div><h2>Весь лист</h2><p>Общие параметры всех подписей.</p></div></div>
        <div class="form-grid">
          <label class="field">
            <span>Шрифт</span>
            <select id="fontFamily">
              <option value="narrow">Arial Narrow</option>
              <option value="neutral">Arial</option>
              <option value="humanist">Trebuchet</option>
              <option value="serif">Georgia</option>
              <option value="mono">Courier</option>
              <option value="display">Impact</option>
            </select>
          </label>
          <label class="field">
            <span>Копий на A4</span>
            <select id="copies">
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option selected>8</option>
            </select>
          </label>
          <label class="field field-wide range-field">
            <span>Размер названия <output id="titleSizeValue">2.55 мм</output></span>
            <input id="titleSize" type="range" min="1.8" max="3.6" step="0.05" value="2.55">
          </label>
          <label class="field field-wide range-field">
            <span>Размер иконки <output id="iconSizeValue">8.2 мм</output></span>
            <input id="iconSize" type="range" min="5" max="10.5" step="0.1" value="8.2">
          </label>
        </div>
        <div class="switch-list">
          <label class="switch"><input id="uppercase" type="checkbox" checked><span></span>Название прописными</label>
          <label class="switch"><input id="showCalibration" type="checkbox" checked><span></span>Линейка 50 мм</label>
        </div>
      </section>
    </aside>

    <section class="canvas" aria-label="Предпросмотр печати">
      <div class="canvas-toolbar">
        <div>
          <strong>Лист A4 · альбомный</strong>
          <span>Наклейка 228 × 18 мм · печатать без масштабирования</span>
        </div>
        <div class="save-state" id="saveState"><span></span>Сохранено в браузере</div>
      </div>
      <div class="sheet-stage">
        <div class="sheet" id="printSheetPreview" aria-label="Лист A4 с полосами"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
